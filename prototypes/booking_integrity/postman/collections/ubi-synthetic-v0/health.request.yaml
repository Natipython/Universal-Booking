$kind: http-request
method: GET
url: '{{base_url}}/v0/health'
order: 1000
headers:
  - key: 'X-Ubi-Demo-Principal'
    value: 'demo-owner-a'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!/^http:\/\/127\.0\.0\.1:\d+$/.test(pm.variables.get('base_url'))) { pm.execution.skipRequest(); throw new Error('Refusing non-loopback synthetic target'); }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200',()=>pm.response.to.have.status(200));
      const body=pm.response.json();
      pm.test('synthetic marker',()=>pm.expect(body.demo_only).to.eql(true));
      pm.test('no-store',()=>pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('correlation ID',()=>pm.expect(pm.response.headers.get('X-Request-ID')).to.match(/^[a-f0-9-]{36}$/));
      pm.test('declared response schema',()=>pm.response.to.have.jsonSchema({"type":"object","additionalProperties":false,"properties":{"demo_only":{"type":"boolean","const":true},"status":{"type":"string","const":"synthetic_only"}},"required":["demo_only","status"]}));
      pm.test('declared content type',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
