$kind: http-request
method: GET
url: '{{base_url}}/v0/bookings/{{booking_id}}'
order: 5000
headers:
  - key: 'X-Ubi-Demo-Principal'
    value: 'demo-owner-b'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!/^http:\/\/127\.0\.0\.1:\d+$/.test(pm.variables.get('base_url'))) { pm.execution.skipRequest(); throw new Error('Refusing non-loopback synthetic target'); }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 404',()=>pm.response.to.have.status(404));
      const body=pm.response.json();
      pm.test('synthetic marker',()=>pm.expect(body.demo_only).to.eql(true));
      pm.test('no-store',()=>pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('correlation ID',()=>pm.expect(pm.response.headers.get('X-Request-ID')).to.match(/^[a-f0-9-]{36}$/));
      pm.test('declared response schema',()=>pm.response.to.have.jsonSchema({"type":"object","additionalProperties":false,"properties":{"type":{"type":"string"},"title":{"type":"string","minLength":1,"maxLength":128},"status":{"type":"integer","minimum":400,"maximum":599},"detail":{"type":"string","minLength":1,"maxLength":128},"code":{"type":"string","minLength":1,"maxLength":128},"correlation_id":{"type":"string","minLength":1,"maxLength":128},"retryable":{"type":"boolean"},"demo_only":{"type":"boolean","const":true}},"required":["type","title","status","detail","code","correlation_id","retryable","demo_only"]}));
      pm.test('declared content type',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
      pm.test('safe domain code',()=>pm.expect(body.code).to.eql('not_found'));
